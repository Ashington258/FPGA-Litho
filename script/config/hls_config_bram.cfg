# K-Litho BRAM Version HLS Configuration
# 用于xcku3p等无DDR板卡的BRAM存储方案
# 
# 存储约束:
# - 总BRAM: ~115KB (65块18Kb BRAM)
# - TCC模式: Nx <= 3
# - SOCS模式: nkernels <= 8

# 项目设置
project_name=hls_litho_system_bram
top_function=hls_litho_system_bram

# 目标设备: Kintex UltraScale+ xcku3p
part_device=xcku3p-ffvb2104-2-e
clock_period=5.0
clock_uncertainty=12.5%

# 源文件
src_files=../src/hls_litho_system_bram.cpp
tb_files=../testbench/litho_system_bram_tb.cpp

# 头文件路径
include_dirs=../include

# 解决方案设置
solution_name=solution1
technology=xilinx
flow_target=vivado

# 优化配置
# - 目标: 200MHz时钟频率
# - BRAM限制: <= 105块 (留10%余量)
# - 延迟: 可接受 (批处理模式)

# 综合策略
synthesis_directive=solution1.directive

# 仿真设置
csim_time=5000000000
cosim_time=5000000000

# 实现设置
impl_target=vivado
impl_strategy=Performance_ExploreWithPostOptPhysOpt
impl_report_level=2

# 调试设置
debug_mode=0
verbose=1

# 输出设置
output_format=ip_catalog
output_version=1.0
output_vendor=k-litho
output_library=hls