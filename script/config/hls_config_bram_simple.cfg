# FPGA-Litho BRAM Version HLS Config for vitis-run
# Target: xcku3p-ffvb2104-2-e (Kintex UltraScale+)

[hls]
# Source files
source_files = src/hls_litho_system_bram.cpp
tb_files = testbench/litho_system_bram_tb.cpp

# Top function
top_function = hls_litho_system_bram

# Part device
part = xcku3p-ffvb2104-2-e

# Clock frequency (200 MHz)
freq = 200000000

# Output directory
work_dir = hls_litho_system_bram_proj

# Flow: csim only for now
flow = csim